name: Cleanup old GitHub Actions runs and artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune only very old completed Actions runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete runs older than 90 days while preserving recent history
        uses: actions/github-script@v7
        with:
          script: |
            const keepPerWorkflow = 20;
            const retentionDays = 90;
            const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;
            const runs = [];
            let page = 1;

            while (true) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page
              });
              runs.push(...response.data.workflow_runs);
              if (response.data.workflow_runs.length < 100) break;
              page += 1;
            }

            // Preserve recent history independently for each workflow.
            const byWorkflow = new Map();
            for (const run of runs) {
              const key = run.workflow_id;
              if (!byWorkflow.has(key)) byWorkflow.set(key, []);
              byWorkflow.get(key).push(run);
            }

            let deleted = 0;
            let skipped = 0;
            for (const workflowRuns of byWorkflow.values()) {
              workflowRuns.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const [index, run] of workflowRuns.entries()) {
                const isOld = new Date(run.created_at).getTime() < cutoff;
                if (index < keepPerWorkflow || !isOld || run.status !== "completed") {
                  skipped++;
                  continue;
                }
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                  deleted++;
                  core.info(`Deleted expired run #${run.run_number} from workflow ${run.workflow_id}.`);
                } catch (error) {
                  core.warning(`Could not delete run #${run.run_number}: ${error.message}`);
                }
              }
            }

            core.notice(`Cleanup complete: deleted ${deleted} completed runs older than ${retentionDays} days; preserved at least ${keepPerWorkflow} runs per workflow and skipped ${skipped} others.`);
