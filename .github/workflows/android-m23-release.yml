name: Android M23 Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-m23-release.yml"
      - "README.md"
      - "patches/android/**"
  push:
    branches:
      - main
      - 'recovery/**'
    paths:
      - ".github/workflows/android-m23-release.yml"
      - "README.md"
      - "patches/android/**"

permissions:
  contents: read

concurrency:
  group: android-m23-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Import Eden source and build Android Legacy Release (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout Skyline-Dimm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "platforms;android-35" "ndk;30.0.16138531" "cmake;3.31.6" "build-tools;36.0.0"

      - name: Clone Eden upstream with recursive submodules
        run: |
          set -euo pipefail
          git clone --recursive --branch v0.2.0-rc1 https://git.eden-emu.dev/eden-emu/eden.git eden
          test "$(git -C eden describe --tags --exact-match)" = "v0.2.0-rc1"
          git -C eden rev-parse HEAD | tee upstream-commit.txt
          git -C eden submodule status --recursive

      - name: Apply Skyline-Dimm Android patches
        working-directory: eden
        run: |
          set -euo pipefail
          # The upstream checkout may not contain overlay-only files from the
          # Skyline-Dimm checkout. Copy the tracked patch explicitly.
          mkdir -p patches/android
          cp ../patches/android/0001-user-prod-keys-reimport.patch patches/android/
          PATCH="patches/android/0001-user-prod-keys-reimport.patch"
          test -s "$PATCH"
          git apply --check "$PATCH"
          git apply "$PATCH"
          grep -q 'action_replace_prod_keys' src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/ui/SettingsFragment.kt
          grep -q 'replace_prod_keys' src/android/app/src/main/res/values/strings.xml

      - name: Install shader compiler tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes glslang-tools
          command -v glslangValidator
          glslangValidator --version

      - name: Install ccache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ccache
          ccache --version

      - name: Build Android Legacy Release
        working-directory: eden
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16138531
          CCACHE: "true"
        run: |
          set -euo pipefail
          chmod +x .ci/android/build.sh
          .ci/android/build.sh --release --target legacy --build-type Release

      - name: Validate APK manifest, alignment and signatures
        working-directory: eden
        run: |
          set -euo pipefail
          APK="artifacts/app-legacy-release.apk"
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" | tee ../apk-badging.txt
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee ../apk-signature.txt
          MIN_SDK="$(sed -n "s/^sdkVersion:'\([0-9][0-9]*\)'$/\1/p" ../apk-badging.txt)"
          test -n "$MIN_SDK"
          if [ "$MIN_SDK" -gt 34 ]; then
            echo "APK minSdk $MIN_SDK exceeds Galaxy M23 API 34" >&2
            exit 1
          fi
          echo "APK minSdk $MIN_SDK is compatible with Galaxy M23 API 34"
          unzip -Z1 "$APK" | tee ../apk-contents.txt
          grep -q '^lib/arm64-v8a/' ../apk-contents.txt

      - name: Upload APK and validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyline-dimm-m23-release-${{ github.run_number }}
          path: |
            eden/artifacts/**
            upstream-commit.txt
            apk-badging.txt
            apk-signature.txt
            apk-contents.txt
          if-no-files-found: warn
          retention-days: 14
