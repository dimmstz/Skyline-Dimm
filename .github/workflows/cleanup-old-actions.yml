name: Cleanup old GitHub Actions runs and artifacts

on:
  push:
  pull_request:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep only the 5 most recent Actions runs
    runs-on: ubuntu-latest
    # Forked PRs receive a read-only GITHUB_TOKEN and must not attempt deletion.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Delete runs older than the five most recent
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 5;
            const runs = [];
            let page = 1;

            while (true) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page
              });
              runs.push(...response.data.workflow_runs);
              if (response.data.workflow_runs.length < 100) break;
              page += 1;
            }

            // GitHub returns runs newest-first. Preserve the five newest runs
            // across all workflows and branches, regardless of their status.
            const retained = new Set(runs.slice(0, keep).map(run => run.id));
            const candidates = runs.slice(keep);
            let deleted = 0;
            let skipped = 0;

            for (const run of candidates) {
              // Never cancel or delete an active build. It will be eligible
              // for cleanup on the next push/PR after it reaches a terminal state.
              if (run.status !== 'completed') {
                skipped += 1;
                core.warning(`Keeping active run #${run.run_number} (${run.status}) to avoid interrupting it.`);
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                deleted += 1;
                core.info(`Deleted run #${run.run_number}; its associated artifacts are removed with the run.`);
              } catch (error) {
                core.warning(`Could not delete run #${run.run_number}: ${error.message}`);
              }
            }

            core.notice(`Cleanup finished: retained the five newest runs; deleted ${deleted} older completed runs (including their artifacts); skipped ${skipped} active runs.`);
