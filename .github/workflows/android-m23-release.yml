name: Android M23 Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "ANDROID-HARDWARE-PERFORMANCE-PROFILES.md"
      - "patches/android/**"
      - "src/android/**"
      - ".github/workflows/android-m23-release.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "ANDROID-HARDWARE-PERFORMANCE-PROFILES.md"
      - "patches/android/**"
      - "src/android/**"
      - ".github/workflows/android-m23-release.yml"

permissions:
  contents: write

concurrency:
  group: android-m23-release-${{ github.ref }}
  # Cancel superseded PR validation runs, but never cancel a main-branch release build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-release:
    name: Import Eden source and build Android Legacy Release (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout Skyline-Dimm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "platforms;android-35" "ndk;30.0.16138531" "cmake;3.31.6" "build-tools;36.0.0"

      - name: Clone Eden upstream with recursive submodules
        run: |
          set -euo pipefail
          git clone --recursive --branch master https://git.eden-emu.dev/eden-emu/eden.git eden
          git -C eden rev-parse HEAD | tee upstream-commit.txt
          git -C eden submodule status --recursive

      - name: Merge complete Eden source into Skyline-Dimm main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -C eden config user.name "github-actions[bot]"
          git -C eden config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test -n "${PR_HEAD_SHA}"
            git -C eden fetch "https://github.com/${GITHUB_REPOSITORY}.git" "${PR_HEAD_SHA}"
          else
            git -C eden fetch "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF_NAME}"
          fi
          SOURCE_SHA="$(git -C eden rev-parse FETCH_HEAD)"
          git -C eden show "${SOURCE_SHA}:README.md" > /tmp/eden-upstream-readme.md
          git -C eden merge --allow-unrelated-histories --no-edit -X ours "${SOURCE_SHA}"
          git -C eden checkout "${SOURCE_SHA}" -- .github/workflows/android-m23-release.yml src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/ui/SettingsFragmentPresenter.kt src/android/app/src/main/res/values/strings.xml
          cp /tmp/eden-upstream-readme.md eden/README-UPSTREAM.md
          cp README.md eden/M23-PERFORMANCE-PROFILE.md
          cp ANDROID-HARDWARE-PERFORMANCE-PROFILES.md eden/ANDROID-HARDWARE-PERFORMANCE-PROFILES.md
          git -C eden add .github/workflows/android-m23-release.yml src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/ui/SettingsFragmentPresenter.kt src/android/app/src/main/res/values/strings.xml README-UPSTREAM.md M23-PERFORMANCE-PROFILE.md ANDROID-HARDWARE-PERFORMANCE-PROFILES.md
          if ! git -C eden diff --cached --quiet; then
            git -C eden commit -m "Integrate Eden upstream source with Galaxy M23 profile"
          fi
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          # Pull-request builds validate the candidate without writing to main.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            git -C eden -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push https://github.com/${GITHUB_REPOSITORY}.git HEAD:main
          fi

      - name: Apply Skyline-Dimm Android patches
        working-directory: eden
        run: |
          set -euo pipefail
          # The upstream checkout may not contain overlay-only files from the
          # Skyline-Dimm checkout. Copy the tracked patch explicitly.
          mkdir -p patches/android
          cp ../patches/android/0001-user-prod-keys-reimport.patch patches/android/
          cp ../patches/android/0003-android-gpu-texture-unswizzle-default.patch patches/android/
          PATCH="patches/android/0001-user-prod-keys-reimport.patch"
          test -s "$PATCH"
          git apply --check "$PATCH"
          git apply "$PATCH"
          grep -q 'action_replace_prod_keys' src/android/app/src/main/java/org/yuzu/yuzu_emu/features/settings/ui/SettingsFragment.kt
          grep -q 'replace_prod_keys' src/android/app/src/main/res/values/strings.xml

          PATCH="patches/android/0003-android-gpu-texture-unswizzle-default.patch"
          test -s "$PATCH"
          git apply --check "$PATCH"
          git apply "$PATCH"
          grep -Fq '#ifdef __ANDROID__' src/common/settings.h
          grep -Fq '"gpu_unswizzle_enabled"' src/common/settings.h

      - name: Install shader compiler tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes glslang-tools
          command -v glslangValidator
          glslangValidator --version

      - name: Install ccache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ccache
          ccache --version

      - name: Build Android Legacy Release
        working-directory: eden
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16138531
          CCACHE: "true"
        run: |
          set -euo pipefail
          chmod +x .ci/android/build.sh
          .ci/android/build.sh --release --target legacy --build-type Release

      - name: Validate APK and AAB manifests, alignment, signatures and contents
        working-directory: eden
        run: |
          set -euo pipefail
          APK="artifacts/app-legacy-release.apk"
          AAB="artifacts/app-legacy-release.aab"
          test -s "$APK"
          test -s "$AAB"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" | tee ../apk-badging.txt
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee ../apk-signature.txt
          grep -q "^sdkVersion:'29'" ../apk-badging.txt
          unzip -Z1 "$APK" | tee ../apk-contents.txt
          grep -q '^lib/arm64-v8a/' ../apk-contents.txt
          unzip -t "$AAB" | tail -n 2
          unzip -Z1 "$AAB" | tee ../aab-contents.txt
          grep -q '^base/lib/arm64-v8a/' ../aab-contents.txt
          sha256sum "$APK" "$AAB" | tee ../SHA256SUMS.txt

      - name: Upload APK, AAB and validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyline-dimm-m23-release-${{ github.run_number }}
          path: |
            eden/artifacts/**
            upstream-commit.txt
            apk-badging.txt
            apk-signature.txt
            apk-contents.txt
            aab-contents.txt
            SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish PR test release
        if: success() && github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: m23-pr-${{ github.event.pull_request.number }}-build-${{ github.run_number }}
          name: Skyline-Dimm M23 PR #${{ github.event.pull_request.number }} Test Build ${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            eden/artifacts/app-legacy-release.apk
            eden/artifacts/app-legacy-release.aab
            SHA256SUMS.txt

      - name: Publish stable APK and AAB GitHub Release
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: m23-build-${{ github.run_number }}
          name: Skyline-Dimm M23 Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          files: |
            eden/artifacts/app-legacy-release.apk
            eden/artifacts/app-legacy-release.aab
            SHA256SUMS.txt
