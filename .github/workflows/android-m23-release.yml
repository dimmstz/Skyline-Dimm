name: Android M23 Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-m23-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    name: Import Eden source and build Android Legacy Release (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout Skyline-Dimm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "platforms;android-35" "ndk;30.0.16138531" "cmake;3.31.6" "build-tools;36.0.0"

      - name: Clone Eden upstream with recursive submodules
        run: |
          set -euo pipefail
          git clone --recursive --branch master https://git.eden-emu.dev/eden-emu/eden.git eden
          git -C eden rev-parse HEAD | tee upstream-commit.txt
          git -C eden submodule status --recursive

      - name: Integrate Skyline-Dimm source and M23 profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -C eden config user.name "github-actions[bot]"
          git -C eden config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test -n "${PR_HEAD_SHA}"
            git -C eden fetch "https://github.com/${GITHUB_REPOSITORY}.git" "${PR_HEAD_SHA}"
          else
            git -C eden fetch "https://github.com/${GITHUB_REPOSITORY}.git" main
          fi

          SOURCE_SHA="$(git -C eden rev-parse FETCH_HEAD)"
          git -C eden show "${SOURCE_SHA}:README.md" > /tmp/skyline-readme.md
          git -C eden merge --allow-unrelated-histories --no-edit -X ours "${SOURCE_SHA}"
          git -C eden checkout "${SOURCE_SHA}" -- .github/workflows/android-m23-release.yml

          if git -C eden cat-file -e "${SOURCE_SHA}:M23-PERFORMANCE-PROFILE.md" 2>/dev/null; then
            git -C eden show "${SOURCE_SHA}:M23-PERFORMANCE-PROFILE.md" > M23-PERFORMANCE-PROFILE.md
            cp M23-PERFORMANCE-PROFILE.md eden/M23-PERFORMANCE-PROFILE.md
          fi

          cp /tmp/skyline-readme.md eden/README-SKYLINE.md
          git -C eden add .github/workflows/android-m23-release.yml README-SKYLINE.md M23-PERFORMANCE-PROFILE.md
          if ! git -C eden diff --cached --quiet; then
            git -C eden commit -m "Integrate Skyline-Dimm source with Galaxy M23 profile"
          fi

          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            AUTH_HEADER="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
            git -C eden -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Install shader compiler tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes glslang-tools
          command -v glslangValidator
          glslangValidator --version

      - name: Install ccache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ccache
          ccache --version

      - name: Build Android Legacy Release
        working-directory: eden
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16138531
          CCACHE: "true"
        run: |
          set -euo pipefail
          chmod +x .ci/android/build.sh
          .ci/android/build.sh --release --target legacy --build-type Release

      - name: Validate APK manifest, alignment and signatures
        working-directory: eden
        run: |
          set -euo pipefail
          APK="artifacts/app-legacy-release.apk"
          test -s "${APK}"
          TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          "${TOOLS}/aapt" dump badging "${APK}" | tee ../apk-badging.txt
          "${TOOLS}/zipalign" -c -v 4 "${APK}"
          "${TOOLS}/apksigner" verify --verbose --print-certs "${APK}" | tee ../apk-signature.txt
          grep -q "^sdkVersion:'29'" ../apk-badging.txt
          grep -q "package: name='dev.legacy.eden_emulator'" ../apk-badging.txt
          grep -q "^native-code: 'arm64-v8a'" ../apk-badging.txt
          unzip -Z1 "${APK}" | tee ../apk-contents.txt
          grep -q '^lib/arm64-v8a/' ../apk-contents.txt

      - name: Upload APK and validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyline-dimm-m23-release-${{ github.run_number }}
          path: |
            eden/artifacts/**
            upstream-commit.txt
            apk-badging.txt
            apk-signature.txt
            apk-contents.txt
          if-no-files-found: warn
          retention-days: 14
